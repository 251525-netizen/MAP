<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>사진 지도</title>

  <style>
    /* 기본 여백 제거 */
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    }

    /* 전체 화면을 가로로 2분할 */
    #container { display: flex; width: 100%; height: 100%; }

    /* ---------- 왼쪽: 검색창 + 결과 리스트 ---------- */
    #sidebar {
      width: 340px;
      height: 100%;
      display: flex;
      flex-direction: column;
      border-right: 1px solid #ddd;
      background: #fff;
    }

    #search-box {
      display: flex;
      gap: 6px;
      padding: 12px;
      border-bottom: 1px solid #eee;
    }

    #keyword {
      flex: 1;
      padding: 8px 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 14px;
    }

    #search-btn {
      padding: 8px 14px;
      border: none;
      border-radius: 6px;
      background: #fee500;
      font-weight: bold;
      cursor: pointer;
    }

    #result-list { flex: 1; overflow-y: auto; }

    /* 안내 문구 (검색 중, 오류, 결과 없음) */
    .message { padding: 16px; color: #888; font-size: 14px; line-height: 1.5; }

    /* 리스트 아이템 */
    .place-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border-bottom: 1px solid #f0f0f0;
      cursor: pointer;
    }
    .place-item:hover { background: #fffbe0; }

    .place-thumb {
      width: 64px;
      height: 64px;
      flex-shrink: 0;
      border-radius: 8px;
      object-fit: cover;
      background: #e5e5e5;
    }

    .place-info { min-width: 0; }
    .place-name { font-size: 14px; font-weight: bold; color: #222; }
    .place-addr {
      margin-top: 3px;
      font-size: 12px;
      color: #888;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* ---------- 오른쪽: 지도 + 상세 모달 ---------- */
    #map-area { position: relative; flex: 1; height: 100%; }
    #map { width: 100%; height: 100%; }

    /* 사진 썸네일 커스텀 마커 */
    .photo-marker {
      position: relative;
      width: 56px;
      height: 56px;
      border: 3px solid #fff;
      border-radius: 50%;
      background: #ddd;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.4);
      cursor: pointer;
    }
    .photo-marker img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      display: block;
    }
    /* 마커 아래쪽 뾰족한 꼬리 */
    .photo-marker::after {
      content: "";
      position: absolute;
      left: 50%;
      bottom: -9px;
      transform: translateX(-50%);
      border: 8px solid transparent;
      border-top-color: #fff;
      border-bottom: 0;
    }
    .photo-marker:hover { transform: scale(1.12); }

    /* 상세 정보 모달 (처음에는 숨김) */
    #modal-backdrop {
      display: none;
      position: absolute;
      inset: 0;
      z-index: 1000;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.45);
    }
    #modal-backdrop.open { display: flex; }

    #modal-card {
      position: relative;
      width: min(360px, 90%);
      max-height: 90%;
      overflow-y: auto;
      border-radius: 14px;
      background: #fff;
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.35);
    }

    #modal-close {
      position: absolute;
      top: 8px;
      right: 8px;
      width: 30px;
      height: 30px;
      border: none;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.55);
      color: #fff;
      font-size: 16px;
      cursor: pointer;
    }

    #modal-image {
      display: block;
      width: 100%;
      height: 220px;
      object-fit: cover;
      background: #e5e5e5;
    }

    #modal-gallery { display: flex; gap: 6px; padding: 8px 14px 0; }
    #modal-gallery img {
      width: 56px;
      height: 56px;
      border-radius: 6px;
      object-fit: cover;
      cursor: pointer;
    }

    #modal-body { padding: 12px 14px 16px; }
    #modal-title { font-size: 18px; margin-bottom: 6px; }
    #modal-address { font-size: 13px; color: #666; margin-bottom: 10px; }
    #modal-overview {
      font-size: 13px;
      line-height: 1.6;
      color: #333;
      white-space: pre-line; /* 줄바꿈 유지 */
    }

    /* 화면이 좁은 모바일에서는 위아래로 배치 */
    @media (max-width: 700px) {
      #container { flex-direction: column; }
      #sidebar { width: 100%; height: 40%; border-right: none; border-bottom: 1px solid #ddd; }
      #map-area { height: 60%; }
    }
  </style>
</head>
<body>
  <div id="container">
    <!-- 왼쪽 영역 -->
    <div id="sidebar">
      <div id="search-box">
        <input type="text" id="keyword" placeholder="지역명 입력 (예: 제주, 부산, 경주)" />
        <button id="search-btn">검색</button>
      </div>
      <div id="result-list">
        <p class="message">지역명을 입력하고 검색 버튼을 눌러보세요.</p>
      </div>
    </div>

    <!-- 오른쪽 영역 (지도 + 상세 모달) -->
    <div id="map-area">
      <div id="map"></div>

      <div id="modal-backdrop">
        <div id="modal-card">
          <button id="modal-close" aria-label="닫기">✕</button>
          <img id="modal-image" alt="" />
          <div id="modal-gallery"></div>
          <div id="modal-body">
            <h2 id="modal-title"></h2>
            <p id="modal-address"></p>
            <p id="modal-overview"></p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- 카카오 지도 SDK
       autoload=false : SDK가 다 로드된 뒤에 kakao.maps.load()로 직접 실행 (로딩 오류 방지)
       libraries=services : 지역명 → 좌표 변환(주소/장소 검색)에 사용 -->
  <script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=a99c2258308740108382db4d6ec009ec&libraries=services&autoload=false"></script>

  <script>
    // =========================================================
    // 1. 설정값
    // =========================================================
    const MAP_LEVEL = 5;                 // 지도 확대 레벨 (작을수록 더 확대)
    const DEFAULT_LAT = 37.5665;         // 위치 권한 거부 시 기본 위치 (서울시청)
    const DEFAULT_LNG = 126.9780;

    // 한국관광공사 TourAPI (KorService2 버전)
    const TOUR_API_KEY = "1c2af06ba22a954988a491be918165cdacd07467751d8d5ed89b3c48ef503642";
    const TOUR_BASE_URL = "https://apis.data.go.kr/B551011/KorService2";
    const SEARCH_RADIUS = 20000;         // 검색 반경 (미터, 최대 20000)
    const MAX_RESULTS = 30;              // 화면에 보여줄 최대 장소 수

    // =========================================================
    // 2. 전역 변수
    // =========================================================
    let map = null;                      // 카카오 지도 객체
    let markerOverlays = [];             // 지도에 올려둔 마커들 (검색할 때 지우기 위해 저장)
    let detailRequestId = 0;             // 상세 정보 요청 번호 (빠르게 여러 개 눌렀을 때 꼬임 방지)
    const detailCache = {};              // 이미 불러온 상세 정보 저장 (같은 API 중복 호출 방지)

    // 자주 쓰는 HTML 요소들
    const keywordInput = document.getElementById("keyword");
    const searchBtn = document.getElementById("search-btn");
    const resultList = document.getElementById("result-list");
    const modalBackdrop = document.getElementById("modal-backdrop");
    const modalClose = document.getElementById("modal-close");
    const modalImage = document.getElementById("modal-image");
    const modalGallery = document.getElementById("modal-gallery");
    const modalTitle = document.getElementById("modal-title");
    const modalAddress = document.getElementById("modal-address");
    const modalOverview = document.getElementById("modal-overview");

    // =========================================================
    // 3. 지도 만들기 (현재 위치 중심)
    // =========================================================
    function createMap(lat, lng) {
      map = new kakao.maps.Map(document.getElementById("map"), {
        center: new kakao.maps.LatLng(lat, lng),
        level: MAP_LEVEL
      });
    }

    // SDK 로드가 끝난 뒤에 실행됨
    kakao.maps.load(function () {
      if (!navigator.geolocation) {
        createMap(DEFAULT_LAT, DEFAULT_LNG);
        return;
      }
      navigator.geolocation.getCurrentPosition(
        function (position) {
          createMap(position.coords.latitude, position.coords.longitude);
        },
        function (error) {
          console.log("위치 가져오기 실패:", error.message);
          createMap(DEFAULT_LAT, DEFAULT_LNG);
        }
      );
    });

    // =========================================================
    // 4. 도우미 함수
    // =========================================================

    // 관광공사 이미지 주소가 http로 오는 경우가 있어서 https로 바꿔줌 (혼합 콘텐츠 차단 방지)
    function toHttps(url) {
      return url ? url.replace(/^http:\/\//, "https://") : "";
    }

    // 설명 글에 섞인 <br> 같은 HTML 태그를 정리
    function cleanText(text) {
      return (text || "")
        .replace(/<br\s*\/?>/gi, "\n")
        .replace(/<[^>]*>/g, "")
        .trim();
    }

    // 왼쪽 리스트에 안내 문구 표시
    function showMessage(text) {
      resultList.innerHTML = "";
      const p = document.createElement("p");
      p.className = "message";
      p.textContent = text;
      resultList.appendChild(p);
    }

    // 기존 마커, 리스트, 모달을 모두 지움 (새로 검색할 때 호출)
    function clearResults() {
      markerOverlays.forEach(function (overlay) {
        overlay.setMap(null);
      });
      markerOverlays = [];
      resultList.innerHTML = "";
      closeDetail();
    }

    // =========================================================
    // 5. TourAPI 호출
    // =========================================================

    // endpoint 이름과 추가 파라미터를 받아서 items 배열을 돌려주는 함수
    async function callTourApi(endpoint, extraParams) {
      const params = new URLSearchParams(Object.assign({
        serviceKey: TOUR_API_KEY,
        MobileOS: "WEB",
        MobileApp: "PhotoMap",
        _type: "json"
      }, extraParams));

      const response = await fetch(TOUR_BASE_URL + "/" + endpoint + "?" + params.toString());
      const text = await response.text();

      // JSON이 아니면 (XML 오류 응답 등) 키 문제일 가능성이 큼
      let data;
      try {
        data = JSON.parse(text);
      } catch (e) {
        throw new Error("TourAPI 응답을 읽을 수 없어요. API 키와 활용신청 상태를 확인해 주세요.");
      }

      const header = data.response && data.response.header;
      if (!header || header.resultCode !== "0000") {
        throw new Error(header ? header.resultMsg : "알 수 없는 응답이에요.");
      }

      // 결과가 없으면 items가 빈 문자열로 오고, 1개면 배열이 아닌 객체로 올 수 있음
      const items = data.response.body.items;
      if (!items || !items.item) return [];
      return Array.isArray(items.item) ? items.item : [items.item];
    }

    // 지역명 → 좌표 변환 (카카오 API: 주소 검색 → 실패하면 장소 검색)
    function findRegion(keyword) {
      return new Promise(function (resolve, reject) {
        const geocoder = new kakao.maps.services.Geocoder();
        const places = new kakao.maps.services.Places();
        const OK = kakao.maps.services.Status.OK;

        geocoder.addressSearch(keyword, function (result, status) {
          if (status === OK) {
            resolve({ lat: Number(result[0].y), lng: Number(result[0].x) });
            return;
          }
          places.keywordSearch(keyword, function (result2, status2) {
            if (status2 === OK) {
              resolve({ lat: Number(result2[0].y), lng: Number(result2[0].x) });
            } else {
              reject(new Error("'" + keyword + "' 지역을 찾지 못했어요."));
            }
          });
        });
      });
    }

    // 장소 하나의 상세 정보(설명 + 추가 사진) 가져오기
    async function loadDetail(contentId) {
      if (detailCache[contentId]) return detailCache[contentId];

      // 설명과 사진을 동시에 요청 (실패해도 다른 쪽은 보이도록 각각 catch)
      const results = await Promise.all([
        callTourApi("detailCommon2", { contentId: contentId }).catch(function () { return []; }),
        callTourApi("detailImage2", { contentId: contentId, imageYN: "Y", numOfRows: 5 }).catch(function () { return []; })
      ]);

      const detail = {
        overview: results[0][0] ? cleanText(results[0][0].overview) : "",
        images: results[1]
      };
      detailCache[contentId] = detail;
      return detail;
    }

    // =========================================================
    // 6. 검색 실행
    // =========================================================
    async function searchPlaces() {
      const keyword = keywordInput.value.trim();
      if (!keyword) {
        alert("지역명을 입력해 주세요!");
        return;
      }
      if (!map) {
        alert("지도를 불러오는 중이에요. 잠시 후 다시 눌러주세요.");
        return;
      }

      clearResults();                    // 기존 마커/리스트 지우기
      showMessage("검색 중...");

      try {
        // (1) 카카오 API로 지역명을 좌표로 변환
        const region = await findRegion(keyword);
        map.setCenter(new kakao.maps.LatLng(region.lat, region.lng));

        // (2) TourAPI로 그 좌표 주변 관광지 목록 조회 (가까운 순)
        const items = await callTourApi("locationBasedList2", {
          mapX: region.lng,
          mapY: region.lat,
          radius: SEARCH_RADIUS,
          arrange: "E",
          numOfRows: 100,
          pageNo: 1
        });

        // (3) 사진 지도니까 대표 사진이 있는 장소만 사용
        const photoItems = items.filter(function (item) {
          return item.firstimage;
        }).slice(0, MAX_RESULTS);

        if (photoItems.length === 0) {
          showMessage("사진이 있는 장소를 찾지 못했어요. 다른 지역으로 검색해 보세요.");
          return;
        }

        renderResults(photoItems);
      } catch (error) {
        showMessage("검색에 실패했어요: " + error.message);
      }
    }

    // =========================================================
    // 7. 결과 표시 (리스트 + 마커)
    // =========================================================
    function renderResults(items) {
      resultList.innerHTML = "";
      const bounds = new kakao.maps.LatLngBounds();   // 모든 마커가 보이도록 범위 계산용

      items.forEach(function (item) {
        const position = new kakao.maps.LatLng(Number(item.mapy), Number(item.mapx));
        bounds.extend(position);

        // 리스트 항목 추가
        resultList.appendChild(createListItem(item, position));

        // 지도 마커 추가
        const overlay = new kakao.maps.CustomOverlay({
          position: position,
          content: createMarkerElement(item),
          yAnchor: 1.2,
          clickable: true
        });
        overlay.setMap(map);
        markerOverlays.push(overlay);
      });

      map.setBounds(bounds);              // 모든 마커가 한 화면에 보이도록 지도 조정
    }

    // 왼쪽 리스트의 장소 한 칸 만들기
    function createListItem(item, position) {
      const li = document.createElement("div");
      li.className = "place-item";

      const thumb = document.createElement("img");
      thumb.className = "place-thumb";
      thumb.src = toHttps(item.firstimage2 || item.firstimage);
      thumb.alt = item.title;
      thumb.addEventListener("error", function () { thumb.style.visibility = "hidden"; });

      const info = document.createElement("div");
      info.className = "place-info";

      const name = document.createElement("div");
      name.className = "place-name";
      name.textContent = item.title;

      const addr = document.createElement("div");
      addr.className = "place-addr";
      addr.textContent = item.addr1 || "";

      info.appendChild(name);
      info.appendChild(addr);
      li.appendChild(thumb);
      li.appendChild(info);

      // 클릭하면 지도 이동 + 상세 팝업
      li.addEventListener("click", function () {
        openDetail(item, position);
      });
      return li;
    }

    // 사진 썸네일 커스텀 마커 만들기
    function createMarkerElement(item) {
      const marker = document.createElement("div");
      marker.className = "photo-marker";
      marker.title = item.title;

      const img = document.createElement("img");
      img.src = toHttps(item.firstimage2 || item.firstimage);
      img.alt = item.title;
      marker.appendChild(img);

      // 클릭하면 상세 팝업
      marker.addEventListener("click", function () {
        const position = new kakao.maps.LatLng(Number(item.mapy), Number(item.mapx));
        openDetail(item, position);
      });
      return marker;
    }

    // =========================================================
    // 8. 상세 정보 팝업 (모달)
    // =========================================================
    function openDetail(item, position) {
      const requestId = ++detailRequestId;

      // 먼저 이미 가진 정보를 바로 보여줌
      modalImage.src = toHttps(item.firstimage);
      modalImage.alt = item.title;
      modalTitle.textContent = item.title;
      modalAddress.textContent = "📍 " + [item.addr1, item.addr2].filter(Boolean).join(" ");
      modalOverview.textContent = "설명을 불러오는 중...";
      modalGallery.innerHTML = "";
      modalBackdrop.classList.add("open");

      map.panTo(position);                // 선택한 장소로 지도 이동

      // 설명과 추가 사진은 API로 따로 불러와서 채움
      loadDetail(item.contentid).then(function (detail) {
        if (requestId !== detailRequestId) return;   // 그 사이 다른 장소를 눌렀다면 무시

        modalOverview.textContent = detail.overview || "등록된 설명이 없어요.";

        // 추가 사진(최대 4장): 작은 사진을 누르면 큰 사진이 바뀜
        detail.images.slice(0, 4).forEach(function (image) {
          const small = document.createElement("img");
          small.src = toHttps(image.smallimageurl || image.originimgurl);
          small.alt = item.title;
          small.addEventListener("click", function () {
            modalImage.src = toHttps(image.originimgurl);
          });
          modalGallery.appendChild(small);
        });
      });
    }

    function closeDetail() {
      detailRequestId++;
      modalBackdrop.classList.remove("open");
    }

    // =========================================================
    // 9. 이벤트 연결
    // =========================================================
    searchBtn.addEventListener("click", searchPlaces);
    keywordInput.addEventListener("keydown", function (e) {
      if (e.key === "Enter") searchPlaces();       // 엔터키로도 검색
    });

    modalClose.addEventListener("click", closeDetail);
    modalBackdrop.addEventListener("click", function (e) {
      if (e.target === modalBackdrop) closeDetail();   // 어두운 배경을 누르면 닫기
    });
    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape") closeDetail();           // ESC로 닫기
    });
  </script>
</body>
</html>
