<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>카카오맵 장소 검색</title>

  <style>
    /* 기본 여백 제거 */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    }

    /* 전체 화면을 가로로 2분할 */
    #container {
      display: flex;
      width: 100%;
      height: 100%;
    }

    /* 왼쪽: 검색창 + 결과 리스트 */
    #sidebar {
      width: 320px;
      height: 100%;
      display: flex;
      flex-direction: column;
      border-right: 1px solid #ddd;
      background: #fff;
    }

    /* 검색창 영역 */
    #search-box {
      display: flex;
      gap: 6px;
      padding: 12px;
      border-bottom: 1px solid #eee;
    }

    #keyword {
      flex: 1;
      padding: 8px 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 14px;
    }

    #search-btn {
      padding: 8px 14px;
      border: none;
      border-radius: 6px;
      background: #fee500;
      font-weight: bold;
      cursor: pointer;
    }

    /* 검색 결과 리스트 영역 (나중에 결과가 들어갈 자리) */
    #result-list {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      color: #888;
      font-size: 14px;
    }

    /* 오른쪽: 지도 */
    #map {
      flex: 1;
      height: 100%;
    }

    /* 화면이 좁은 모바일에서는 위아래로 배치 */
    @media (max-width: 700px) {
      #container {
        flex-direction: column;
      }
      #sidebar {
        width: 100%;
        height: 40%;
        border-right: none;
        border-bottom: 1px solid #ddd;
      }
      #map {
        height: 60%;
      }
    }
  </style>
</head>
<body>
  <div id="container">
    <!-- 왼쪽 영역 -->
    <div id="sidebar">
      <div id="search-box">
        <input type="text" id="keyword" placeholder="장소를 검색하세요" />
        <button id="search-btn">검색</button>
      </div>
      <div id="result-list">검색 결과가 여기에 표시됩니다.</div>
    </div>

    <!-- 오른쪽 영역 (지도) -->
    <div id="map"></div>
  </div>

  <!-- 카카오 지도 SDK
       autoload=false : SDK가 다 로드된 뒤에 kakao.maps.load()로 직접 실행 (로딩 오류 방지)
       libraries=services : 나중에 장소 검색 기능에 필요 -->
  <script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=a99c2258308740108382db4d6ec009ec&libraries=services&autoload=false"></script>

  <script>
    // 지도 확대 레벨 (숫자가 작을수록 더 확대됨)
    const MAP_LEVEL = 5;

    // 위치 권한을 거부했을 때 사용할 기본 위치 (서울시청)
    const DEFAULT_LAT = 37.5665;
    const DEFAULT_LNG = 126.9780;

    // 지도 객체 (다른 기능에서도 쓰려고 바깥에 선언)
    let map = null;

    // 지도를 만드는 함수
    function createMap(lat, lng) {
      const container = document.getElementById("map");
      const options = {
        center: new kakao.maps.LatLng(lat, lng),
        level: MAP_LEVEL
      };
      map = new kakao.maps.Map(container, options);
    }

    // SDK 로드가 끝난 뒤에 실행됨
    kakao.maps.load(function () {
      // 브라우저가 위치 기능을 지원하는지 확인
      if (!navigator.geolocation) {
        createMap(DEFAULT_LAT, DEFAULT_LNG);
        alert("이 브라우저는 위치 기능을 지원하지 않아요. 기본 위치로 표시할게요.");
        return;
      }

      // 위치 권한 요청 → 허용하면 현재 위치, 거부하면 기본 위치
      navigator.geolocation.getCurrentPosition(
        function (position) {
          // 성공: 현재 위치를 중심으로 지도 표시
          createMap(position.coords.latitude, position.coords.longitude);
        },
        function (error) {
          // 실패(권한 거부 등): 기본 위치로 지도 표시
          console.log("위치 가져오기 실패:", error.message);
          createMap(DEFAULT_LAT, DEFAULT_LNG);
        }
      );
    });
  </script>
</body>
</html>
